name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  # ---------- Static quality gates (mandatory) ----------
  quality:
    name: Format · Lint · Typecheck · Dependency rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps:check

  # ---------- Unit tests + builds (mandatory) ----------
  test-build:
    name: Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Mobile bundles through Metro
        run: pnpm --filter @quest/mobile exec expo export --platform android --output-dir /tmp/expo-out
        env:
          CI: 1

  # ---------- Database migrations against real PostGIS + pgvector (mandatory) ----------
  migrations:
    name: Migrations · Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh-clone condition, asserted rather than assumed: GitHub jobs are isolated, so this job
      # must work with no build output from the `test-build` job and none of its own. Every step
      # below either needs no `dist/` (the database CLIs) or builds what it needs (the suites).
      - name: Remove any workspace build output (fresh-clone condition)
        run: rm -rf packages/*/dist apps/*/dist
      - name: Start PostgreSQL (PostGIS + pgvector) and Redis
        run: docker compose up -d --wait postgres redis
      - name: Migration status on clean database (must report pending)
        run: '! pnpm db:migrate:status'
        env:
          DATABASE_URL: postgresql://quest:quest@localhost:5432/quest
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://quest:quest@localhost:5432/quest
      - name: Migration status after apply (must be clean) and idempotent re-run
        run: pnpm db:migrate:status && pnpm db:migrate
        env:
          DATABASE_URL: postgresql://quest:quest@localhost:5432/quest
      # Through Turbo, whose `test:integration` task depends on `^build`: it builds exactly the
      # API's workspace dependencies (types, config, events, ai, api-client) and nothing else —
      # no hardcoded list, no web/admin/mobile builds, no artifacts copied between jobs.
      - name: Integration tests (builds the API's workspace dependencies first)
        run: pnpm turbo run test:integration --filter=@quest/api
        env:
          RUN_INTEGRATION: 'true'
          DATABASE_URL: postgresql://quest:quest@localhost:5432/quest
          REDIS_URL: redis://localhost:6379
      - if: always()
        run: docker compose down -v

  # ---------- Local infrastructure configuration (mandatory) ----------
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ---------- Terraform (mandatory) ----------
  terraform:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
      - name: Format check
        run: terraform fmt -recursive -check
      - name: Validate every module
        # A module that declares `configuration_aliases` (needs a provider alias passed in by its
        # caller) cannot be validated as a root module; it is validated through its examples/*
        # root(s) instead, which supply the provider configurations exactly as environments/dev does.
        run: |
          set -euo pipefail
          for d in modules/*/; do
            if grep -qs 'configuration_aliases' "$d"*.tf; then
              found=0
              for ex in "$d"examples/*/; do
                [ -d "$ex" ] || continue
                found=1
                echo "== $ex (alias-dependent module ${d} validated through its example root)"
                (cd "$ex" && terraform init -backend=false -input=false >/dev/null && terraform validate)
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::${d} declares configuration_aliases but has no examples/*/ root to validate it"
                exit 1
              fi
            else
              echo "== $d"
              (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
            fi
          done
      - name: Validate dev environment
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false -input=false >/dev/null && terraform validate

  # ---------- Security (mandatory) ----------
  security:
    name: Secret scan · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (verified secrets fail the build)
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          extra_args: --only-verified
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit (high+ fails)
        run: pnpm audit --audit-level=high
